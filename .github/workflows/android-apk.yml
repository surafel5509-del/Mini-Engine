name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager under $SDK_ROOT/cmdline-tools" >&2
            ls -la "$SDK_ROOT" "$SDK_ROOT/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android build tools
        run: |
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle --no-daemon --console=plain --stacktrace -p editor -PminiRenderer=gles3 :app:assembleDebug

      - name: Verify JNI symbols are in the APK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mini-engine-apk-check"
          unzip -q editor/app/build/outputs/apk/debug/app-debug.apk -d "$RUNNER_TEMP/mini-engine-apk-check"
          for abi in arm64-v8a armeabi-v7a; do
            library="$RUNNER_TEMP/mini-engine-apk-check/lib/$abi/libminiengine.so"
            test -s "$library"
            readelf --dyn-syms --wide "$library" | grep -q 'Java_com_miniengine_editor_bridge_NativeBridge_nativeInit'
            readelf --dyn-syms --wide "$library" | grep -q 'Java_com_miniengine_editor_bridge_NativeBridge_nativeSetEntityVisible'
            readelf --dyn-syms --wide "$library" | grep -q 'Java_com_miniengine_editor_bridge_NativeBridge_nativeAdjustEntityTransform'
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-engine-debug-apk
          path: editor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
